<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0d1b2a"/>
<title>สชป.11 Weather</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#0a0e1a;--bg2:#0d1b2a;--bg3:#111e30;
  --bd:#1e3a5f;--bd2:#2a4a6e;
  --tx:#e0e6f0;--tx2:#a0b8d0;--tx3:#7a9cc0;--tx4:#4a7aaa;
  --bl:#1e90ff;--bl2:#0066cc;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}

/* APP SHELL */
#app{display:flex;flex-direction:column;
  height:100vh;height:100dvh;
  padding-top:env(safe-area-inset-top,0px)}

/* HEADER */
#hdr{background:linear-gradient(135deg,var(--bg2),#1a2744);
  border-bottom:1px solid var(--bd);
  padding:0 14px;height:50px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.hlogo{width:30px;height:30px;background:linear-gradient(135deg,var(--bl),#00c8ff);
  border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0}
.htx{margin-left:9px}
.htx h1{font-size:.85rem;font-weight:700;color:#fff}
.htx p{font-size:.58rem;color:var(--tx3)}
.hlive{display:flex;align-items:center;gap:4px;
  background:rgba(0,200,100,.12);border:1px solid rgba(0,200,100,.3);
  border-radius:20px;padding:3px 8px;font-size:.63rem;color:#00e676;font-weight:600}
.ldot{width:5px;height:5px;background:#00e676;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* CTRL */
#ctrl{height:40px;background:var(--bg2);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 10px;gap:5px;
  flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#ctrl::-webkit-scrollbar{display:none}
.lb{padding:4px 10px;border-radius:6px;border:1px solid var(--bd2);
  background:transparent;color:var(--tx2);font-size:.68rem;cursor:pointer;
  white-space:nowrap;-webkit-appearance:none;touch-action:manipulation;flex-shrink:0}
.lb.on{background:linear-gradient(135deg,var(--bl),var(--bl2));
  border-color:var(--bl);color:#fff}
.sep{width:1px;height:18px;background:var(--bd);flex-shrink:0;margin:0 2px}

/* ANIM BAR */
#animbar{height:36px;background:#060c18;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0}
.abtn{width:26px;height:26px;border-radius:5px;border:1px solid var(--bd2);
  background:transparent;color:var(--tx2);font-size:.78rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;-webkit-appearance:none;touch-action:manipulation}
.abtn.on{background:var(--bl);border-color:var(--bl);color:#fff}
#tl{flex:1;display:flex;gap:2px;overflow:hidden;min-width:0}
.tf{flex:1;height:20px;border-radius:3px;background:#1a2e4a;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:.48rem;color:var(--tx4);min-width:0;touch-action:manipulation}
.tf.on{background:var(--bl);color:#fff}
#atime{font-size:.63rem;color:var(--tx3);white-space:nowrap;flex-shrink:0}

/* BODY */
#body{flex:1;display:flex;overflow:hidden;min-height:0}
#map{flex:1;height:100%;z-index:1;min-width:0}

/* DESKTOP SIDEBAR */
#sb{width:290px;flex-shrink:0;background:var(--bg2);
  border-left:1px solid var(--bd);overflow-y:auto;
  -webkit-overflow-scrolling:touch}
#sb::-webkit-scrollbar{width:3px}
#sb::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}

/* MOBILE BOTTOM SHEET */
#sheet{position:fixed;bottom:0;left:0;right:0;z-index:2000;
  background:var(--bg2);border-top:2px solid var(--bd);
  border-radius:16px 16px 0 0;
  max-height:78vh;
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -4px 24px rgba(0,0,0,.7);
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  /* CRITICAL: always in DOM, just hidden via transform */
}
#sheet.open{transform:translateY(0)}
#sheet-handle{width:36px;height:4px;background:var(--bd2);border-radius:2px;
  margin:10px auto 4px;flex-shrink:0;cursor:pointer}
#sheet-scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain}

/* FAB */
#fab{position:fixed;
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  right:16px;z-index:1500;
  width:50px;height:50px;border-radius:50%;
  background:linear-gradient(135deg,var(--bl),var(--bl2));
  border:none;color:#fff;font-size:1.2rem;cursor:pointer;
  box-shadow:0 4px 16px rgba(30,144,255,.5);
  touch-action:manipulation;
  display:none;align-items:center;justify-content:center}

/* SECTIONS */
.ss{padding:11px;border-bottom:1px solid #1a2e4a}
.ss h3{font-size:.62rem;text-transform:uppercase;letter-spacing:1.2px;
  color:var(--tx4);margin-bottom:8px}

/* FORECAST */
.ftabs{display:flex;gap:4px;margin-bottom:8px}
.ftab{flex:1;padding:5px 0;border-radius:6px;border:1px solid var(--bd2);
  background:transparent;color:var(--tx3);font-size:.68rem;cursor:pointer;
  text-align:center;-webkit-appearance:none;touch-action:manipulation}
.ftab.on{background:linear-gradient(135deg,#1e3a6e,#0d2a50);
  border-color:var(--bl);color:#fff}
.fpanel{display:none}
.fpanel.on{display:block}
.fc-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.fc{background:var(--bg3);border:1px solid var(--bd);border-radius:6px;padding:7px}
.fc-name{font-size:.65rem;font-weight:600;color:#c0d8f0;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-rain{font-size:1rem;font-weight:700}
.fc-bar{height:3px;border-radius:2px;margin-top:4px;background:#1a2e4a}
.fc-fill{height:100%;border-radius:2px}
.sta-sel{width:100%;background:var(--bg3);border:1px solid var(--bd2);
  border-radius:6px;color:#c0d8f0;font-size:.72rem;padding:6px 8px;
  margin-bottom:7px;-webkit-appearance:none;cursor:pointer}
.day-table{width:100%;border-collapse:collapse;font-size:.66rem}
.day-table th{color:var(--tx4);font-weight:600;padding:4px;text-align:center;
  border-bottom:1px solid var(--bd)}
.day-table td{padding:4px;text-align:center;border-bottom:1px solid #111e30;color:#c0d8f0}

/* THIESSEN */
.th-box{background:var(--bg3);border:1px solid var(--bd);border-radius:7px;
  padding:9px;margin-bottom:5px}
.th-row{display:flex;justify-content:space-between;font-size:.67rem;
  color:var(--tx3);margin-bottom:3px}
.th-val{color:#c0d8f0;font-weight:600}

/* PROJECTS */
.pi{display:flex;align-items:flex-start;gap:7px;padding:7px 8px;
  border-radius:6px;border:1px solid var(--bd);background:var(--bg3);
  margin-bottom:4px;cursor:pointer;touch-action:manipulation}
.pi.sel,.pi:active{border-color:var(--bl);background:rgba(30,144,255,.08)}
.pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:3px}
.pname{font-size:.74rem;font-weight:600;color:#d0e4f8}
.rbadge{display:inline-block;padding:2px 6px;border-radius:4px;
  font-size:.63rem;font-weight:700}

/* LEGEND */
.legbar{display:flex;height:10px;border-radius:3px;overflow:hidden;margin-bottom:3px}
.legbar div{flex:1}
.leglbl{display:flex;justify-content:space-between;font-size:.58rem;color:var(--tx4)}

/* ALERT */
.al{display:flex;gap:7px;padding:8px;
  background:rgba(255,100,50,.07);border:1px solid rgba(255,100,50,.22);
  border-radius:6px;margin-bottom:5px}
.at{font-size:.67rem;color:#e0a080;line-height:1.5}
.at strong{color:#ff8060;display:block;margin-bottom:1px}
.noal{font-size:.68rem;color:#3a6a4a;
  background:rgba(0,200,100,.06);border:1px solid rgba(0,200,100,.18);
  border-radius:6px;padding:8px;text-align:center}
.updt{font-size:.62rem;color:var(--tx4);text-align:center;padding:8px}

/* RESPONSIVE */
@media(max-width:768px){
  #sb{display:none}
  #fab{display:flex}
  .htx p{display:none}
}
@media(min-width:769px){
  #sheet{display:none !important}
  #fab{display:none !important}
}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div style="display:flex;align-items:center;flex:1;min-width:0">
      <div class="hlogo">🛰️</div>
      <div class="htx">
        <h1>สชป.11 Weather Dashboard</h1>
        <p>RainViewer Radar · Thiessen Polygon · พยากรณ์ 7 วัน</p>
      </div>
    </div>
    <div class="hlive"><div class="ldot"></div>LIVE</div>
  </div>

  <div id="ctrl">
    <span style="font-size:.6rem;color:var(--tx4);flex-shrink:0">Map</span>
    <button class="lb on" id="btn-gmap" onclick="setBase('gmap')">🗺️ Google</button>
    <button class="lb"    id="btn-gsat" onclick="setBase('gsat')">🛰️ Satellite</button>
    <button class="lb"    id="btn-ghyb" onclick="setBase('ghyb')">🌍 Hybrid</button>
    <button class="lb"    id="btn-dark" onclick="setBase('dark')">🌑 Dark</button>
    <div class="sep"></div>
    <button class="lb on" id="btn-proj"  onclick="toggleLayer('proj')" title="ขอบเขตโครงการ">📐</button>
    <button class="lb on" id="btn-thies" onclick="toggleLayer('thies')" title="Thiessen">🔷</button>
    <button class="lb on" id="btn-sta"   onclick="toggleLayer('sta')" title="สถานี">📍</button>
    <div class="sep"></div>
    <span style="font-size:.6rem;color:var(--tx4);flex-shrink:0">เรดาร์</span>
    <input type="range" id="opSlider" min="0" max="100" value="75"
      style="width:60px;accent-color:var(--bl);flex-shrink:0"
      oninput="updateOpacity(this.value)"/>
    <span id="opVal" style="font-size:.65rem;color:var(--tx3);width:26px;flex-shrink:0">75%</span>
  </div>

  <div id="animbar">
    <button class="abtn" onclick="stepFrame(-1)">◀</button>
    <button class="abtn on" id="btn-play" onclick="togglePlay()">⏸</button>
    <button class="abtn" onclick="stepFrame(1)">▶</button>
    <div id="tl"></div>
    <div id="atime">--:--</div>
  </div>

  <div id="body">
    <div id="map"></div>
    <!-- DESKTOP SIDEBAR -->
    <div id="sb" id="sb-desktop"></div>
  </div>
</div>

<!-- MOBILE BOTTOM SHEET (always in DOM) -->
<div id="sheet">
  <div id="sheet-handle" onclick="toggleSheet()"></div>
  <div id="sheet-scroll"></div>
</div>

<!-- MOBILE FAB -->
<button id="fab" onclick="toggleSheet()">📊</button>

function wIcon(wc){

function fmtDate(s){
  const d=new Date(s);
  return['อา','จ','อ','พ','พฤ','ศ','ส'][d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1);
}
function fmtTime(ts){
  const d=new Date((ts+7*3600)*1000);
  return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
}
function dist2(la1,lo1,la2,lo2){const dl=la1-la2,dn=lo1-lo2;return dl*dl+dn*dn;}
function nearestStation(cx,cy){
  let best=null,bd=Infinity;
  for(const s of STATIONS){const d=dist2(cy,cx,s.lat,s.lon);if(d<bd){bd=d;best=s;}}
  return best;
}

let radarLayer=null,curOpacity=0.75;

function buildRadar(path){
  return L.tileLayer(RV_HOST+path+'/256/{z}/{x}/{y}/4/1_1.png',
    {opacity:curOpacity,tileSize:256,
     maxNativeZoom:6,maxZoom:20,

function applyRadar(){
  if(radarLayer&&map.hasLayer(radarLayer))map.removeLayer(radarLayer);
  const f=RV_FRAMES[curFrame];
  if(!f)return;
  radarLayer=buildRadar(f.path);
  radarLayer.addTo(map);
  raiseOverlays();
  document.getElementById('atime').textContent=fmtTime(f.time);
  document.querySelectorAll('.tf').forEach((el,i)=>el.classList.toggle('on',i===curFrame));
}
function buildTimeline(){
  const tl=document.getElementById('tl');tl.innerHTML='';
  RV_FRAMES.forEach((f,i)=>{
    const el=document.createElement('div');
    el.className='tf'+(i===curFrame?' on':'');
    el.textContent=fmtTime(f.time);
    el.onclick=()=>{curFrame=i;applyRadar();};
    tl.appendChild(el);
  });
}
function stepFrame(d){curFrame=(curFrame+d+RV_FRAMES.length)%RV_FRAMES.length;applyRadar();}

function setBase(t){
  Object.values(BASES).forEach(l=>{if(map.hasLayer(l))map.removeLayer(l);});

// ── VORONOI THIESSEN ──
function cross(O,A,B){return(A[0]-O[0])*(B[1]-O[1])-(A[1]-O[1])*(B[0]-O[0]);}
function convexHull(pts){
  if(pts.length<3)return pts;
  const p=[...pts].sort((a,b)=>a[0]-b[0]||a[1]-b[1]),n=p.length,h=[];
  for(let i=0;i<n;i++){while(h.length>=2&&cross(h[h.length-2],h[h.length-1],p[i])<=0)h.pop();h.push(p[i]);}
  const lo=h.length+1;
  for(let i=n-2;i>=0;i--){while(h.length>=lo&&cross(h[h.length-2],h[h.length-1],p[i])<=0)h.pop();h.push(p[i]);}
  h.pop();return h;
}
function computeVoronoi(){
  const G=250,dLon=(BBOX.maxLon-BBOX.minLon)/G,dLat=(BBOX.maxLat-BBOX.minLat)/G;
  const cells={};STATIONS.forEach(s=>cells[s.id]=[]);
  for(let i=0;i<G;i++)for(let j=0;j<G;j++){
    const lon=BBOX.minLon+(i+.5)*dLon,lat=BBOX.minLat+(j+.5)*dLat;
    let best=null,bd=Infinity;
    for(const s of STATIONS){const d=dist2(lat,lon,s.lat,s.lon);if(d<bd){bd=d;best=s;}}
    if(best)cells[best.id].push([lon,lat]);
  }
  const res={};
  STATIONS.forEach(s=>{
    const pts=cells[s.id];if(!pts.length)return;
    const hl=dLon/2,hlt=dLat/2,corners=[];
    pts.forEach(([lo,la])=>{
      corners.push([lo-hl,la-hlt],[lo+hl,la-hlt],[lo+hl,la+hlt],[lo-hl,la+hlt]);
    });
    res[s.id]={station:s,polygon:convexHull(corners)};
  });
  return res;
}

function renderThiessen(){
  thiesGroup.clearLayers();
  const v=computeVoronoi();
  let t0=0,t3=0,t7=0,maxR=0,maxSta='',cnt=0;
  Object.values(v).forEach(({station:s,polygon:poly})=>{
    if(!poly||poly.length<3)return;
    const rain=s.rain,fc=s.forecast;
    const r3=fc?fc.rain.slice(0,3).reduce((a,b)=>a+b,0):0;
    const r7=fc?fc.rain.reduce((a,b)=>a+b,0):0;
    const rl=rainLabel(rain);
    t0+=rain;t3+=r3;t7+=r7;cnt++;
    if(rain>maxR){maxR=rain;maxSta=s.name;}
    L.polygon(poly.map(([lo,la])=>[la,lo]),{
      color:'#fff',weight:2,fillColor:rainColor(rain),fillOpacity:0.55,opacity:0.9
    }).bindPopup(popupHTML(s.name,rain,r3,r7,rl)).addTo(thiesGroup);
    L.marker([s.lat,s.lon],{icon:L.divIcon({className:'',
      html:`<div style="background:${rl.bg};border:1.5px solid ${rl.tc};border-radius:5px;padding:2px 7px;font-size:12px;font-weight:700;color:${rl.tc};white-space:nowrap;font-family:sans-serif;box-shadow:0 1px 6px rgba(0,0,0,.6)">${rain}<span style="font-size:9px;font-weight:400"> มม.</span></div>`,
      iconAnchor:[20,10]}),interactive:false}).addTo(thiesGroup);
  });
  // Update summary in BOTH desktop and mobile
  ['avg0','avg3','avg7','maxsta'].forEach(id=>{
    document.querySelectorAll('#'+id).forEach(el=>{
      if(id==='avg0')el.textContent=(t0/cnt).toFixed(1)+' มม.';
      else if(id==='avg3')el.textContent=(t3/cnt).toFixed(1)+' มม.';
      else if(id==='avg7')el.textContent=(t7/cnt).toFixed(1)+' มม.';
      else el.textContent=maxSta+' ('+maxR+' มม.)';
    });
  });
}

function popupHTML(name,rain,r3,r7,rl){
  return `<div style="font-family:sans-serif;min-width:170px"><b>${name}</b>
    <hr style="border-color:#333;margin:4px 0">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;text-align:center">
      <div style="background:#111;border-radius:4px;padding:4px"><div style="font-size:.58rem;color:#888">24ชม.</div><div style="font-size:.95rem;font-weight:700;color:${rl.tc}">${rain}</div><div style="font-size:.58rem;color:#888">มม.</div></div>
      <div style="background:#111;border-radius:4px;padding:4px"><div style="font-size:.58rem;color:#888">3วัน</div><div style="font-size:.95rem;font-weight:700;color:#4fc3f7">${typeof r3==='number'?r3.toFixed(1):r3}</div><div style="font-size:.58rem;color:#888">มม.</div></div>
      <div style="background:#111;border-radius:4px;padding:4px"><div style="font-size:.58rem;color:#888">7วัน</div><div style="font-size:.95rem;font-weight:700;color:#ce93d8">${typeof r7==='number'?r7.toFixed(1):r7}</div><div style="font-size:.58rem;color:#888">มม.</div></div>
    </div></div>`;
}

const PCOLS=['#00e5ff','#76ff03','#ffea00','#ff9100','#ff1744','#d500f9',
             '#00bcd4','#8bc34a','#ffc107','#ff5722','#e91e63','#9c27b0'];

function renderProjects(listEl){
  projGroup.clearLayers();
  if(listEl)listEl.innerHTML='';
  PROJECT_GEOJSON.features.forEach((f,i)=>{
    const col=PCOLS[i%PCOLS.length],name=f.properties.name||`โครงการ ${i+1}`;
    const sta=nearestStation(f.properties.cx,f.properties.cy);
    const rain=sta?sta.rain:0,rl=rainLabel(rain),fc=sta?sta.forecast:null;
    const r3=fc?fc.rain.slice(0,3).reduce((a,b)=>a+b,0).toFixed(1):'-';
    const r7=fc?fc.rain.reduce((a,b)=>a+b,0).toFixed(1):'-';
    const poly=L.geoJSON(f,{style:{color:col,weight:2,fillColor:col,fillOpacity:0.08,opacity:0.9}})
      .bindPopup(`<div style="font-family:sans-serif;min-width:180px"><b style="color:${col}">${name}</b><br><span style="font-size:.7rem;color:#aaa">📍 ${sta?sta.name:'—'}</span>${popupHTML('',rain,parseFloat(r3),parseFloat(r7),rl).replace('<b></b>','')}</div>`);
    poly.addTo(projGroup);
    if(listEl){
      const item=document.createElement('div');item.className='pi';
      item.innerHTML=`<div class="pdot" style="background:${col}"></div>
        <div style="flex:1">
          <div class="pname">${name}</div>
          <div style="display:flex;gap:4px;margin-top:2px;flex-wrap:wrap">
            <span class="rbadge" style="background:${rl.bg};color:${rl.tc};border:1px solid ${rl.tc}44">วันนี้ ${rain}มม.</span>
            <span class="rbadge" style="background:#0a1e30;color:#4fc3f7;border:1px solid #4fc3f744">3วัน ${r3}มม.</span>
            <span class="rbadge" style="background:#1a0a2a;color:#ce93d8;border:1px solid #ce93d844">7วัน ${r7}มม.</span>
          </div>
        </div>`;
      item.onclick=()=>{
        document.querySelectorAll('.pi').forEach(el=>el.classList.remove('sel'));
        item.classList.add('sel');
        map.fitBounds(poly.getBounds(),{padding:[30,30]});
        poly.openPopup();
        if(isMobile())closeSheet();
      };
      listEl.appendChild(item);
    }
  });
}

function renderStations(){
  staGroup.clearLayers();
  STATIONS.forEach(s=>{
    const rl=rainLabel(s.rain);
    L.circleMarker([s.lat,s.lon],{
      radius:8,fillColor:rainColor(s.rain),color:'#fff',weight:1.5,fillOpacity:0.9
    }).bindPopup(`<b>📍 ${s.name}</b><br>ฝน 24ชม.: <b style="color:${rl.tc}">${s.rain} มม.</b> (${rl.txt})`).addTo(staGroup);
  });
}

// ── SIDEBAR HTML BUILDER ──
// Uses class-based selectors, NO duplicate IDs
function buildPanelHTML(prefix){
  const maxR=Math.max(...STATIONS.map(s=>s.rain));
  const heavy=STATIONS.filter(s=>s.rain>=35).map(s=>s.name).join(', ');
  return `
  <div class="ss">
    <h3>📊 พยากรณ์ฝน (Open-Meteo)</h3>
    <div class="ftabs">
      <button class="ftab on" onclick="showFC('${prefix}f24',this)">24 ชม.</button>
      <button class="ftab"    onclick="showFC('${prefix}f3d',this)">3 วัน</button>
      <button class="ftab"    onclick="showFC('${prefix}f7d',this)">7 วัน</button>
    </div>
    <div class="fpanel on" id="${prefix}f24"><div class="fc-grid" id="${prefix}fc24"></div></div>
    <div class="fpanel" id="${prefix}f3d">
      <select class="sta-sel" id="${prefix}sel3d" onchange="render3d('${prefix}')"></select>
      <div id="${prefix}fc3d"></div>
    </div>
    <div class="fpanel" id="${prefix}f7d">
      <select class="sta-sel" id="${prefix}sel7d" onchange="render7d('${prefix}')"></select>
      <div id="${prefix}fc7d"></div>
    </div>
  </div>
  <div class="ss">
    <h3>🔷 สรุป Thiessen Polygon</h3>
    <div class="th-box">
      <div class="th-row"><span>วิธีคำนวณ</span><span class="th-val">Voronoi/Thiessen</span></div>
      <div class="th-row"><span>ฝนเฉลี่ย วันนี้</span><span class="th-val" id="avg0">--</span></div>
      <div class="th-row"><span>ฝนเฉลี่ย 3 วัน</span><span class="th-val" id="avg3">--</span></div>
      <div class="th-row"><span>ฝนเฉลี่ย 7 วัน</span><span class="th-val" id="avg7">--</span></div>
      <div class="th-row"><span>สถานีสูงสุด</span><span class="th-val" id="maxsta">--</span></div>
    </div>
  </div>
  <div class="ss">
    <h3>📐 โครงการชลประทาน สชป.11</h3>
    <div id="${prefix}proj-list"></div>
  </div>
  <div class="ss">
    <h3>🌈 ระดับปริมาณฝน (มม./24ชม.)</h3>
    <div class="legbar">
      <div style="background:#b3e5fc"></div><div style="background:#4fc3f7"></div>
      <div style="background:#00e676"></div><div style="background:#ffee58"></div>
      <div style="background:#ffa726"></div><div style="background:#ef5350"></div>
      <div style="background:#ab47bc"></div>
    </div>
    <div class="leglbl"><span>0</span><span>0.1</span><span>10</span><span>35</span><span>90+</span></div>
  </div>
  <div class="ss">
    <h3>⚠️ การแจ้งเตือน</h3>
    ${maxR>=35
      ? `<div class="al"><span>⛈️</span><div class="at"><strong>เฝ้าระวังฝนหนัก</strong>${heavy} · สูงสุด ${maxR} มม./24ชม.</div></div>`
      : `<div class="noal">✅ ไม่มีการแจ้งเตือนพิเศษ</div>`}
  </div>
  <div class="updt">เรดาร์: RainViewer · พยากรณ์: Open-Meteo</div>`;
}

function showFC(panelId,btn){
  const panel=document.getElementById(panelId);
  if(!panel)return;
  const container=panel.closest('.ss');
  container.querySelectorAll('.ftab').forEach(t=>t.classList.remove('on'));
  container.querySelectorAll('.fpanel').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');
  panel.classList.add('on');
}

function render24h(prefix){
  const g=document.getElementById(prefix+'fc24');if(!g)return;g.innerHTML='';
  STATIONS.forEach(s=>{
    const rl=rainLabel(s.rain),pct=Math.min(s.rain/90*100,100);
    g.innerHTML+=`<div class="fc">
      <div class="fc-name" title="${s.name}">${s.name}</div>
      <div class="fc-rain" style="color:${rl.tc}">${s.rain}<span style="font-size:.6rem;font-weight:400;color:#7a9cc0"> มม.</span></div>
      <div style="font-size:.6rem;color:${rl.tc}">${rl.txt}</div>
      <div class="fc-bar"><div class="fc-fill" style="width:${pct}%;background:${rl.tc}"></div></div>
    </div>`;
  });
}

function populateSel(prefix){
  ['sel3d','sel7d'].forEach(id=>{
    const sel=document.getElementById(prefix+id);if(!sel)return;
    STATIONS.forEach(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.name;sel.appendChild(o);});
  });
}

function render3d(prefix){
  const sel=document.getElementById(prefix+'sel3d');if(!sel)return;
  const s=STATIONS.find(x=>x.id===sel.value);if(!s||!s.forecast)return;
  const fc=s.forecast,maxR=Math.max(...fc.rain.slice(0,3),1);
  let html='';
  fc.dates.slice(0,3).forEach((dt,i)=>{
    const r=fc.rain[i]||0,p=fc.prob[i]||0,wc=fc.wcode[i]||0,rl=rainLabel(r),pct=Math.min(r/maxR*100,100);
    html+=`<div style="background:var(--bg3);border:1px solid var(--bd);border-radius:6px;padding:8px;margin-bottom:5px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-size:.73rem;font-weight:600;color:#c0d8f0">${fmtDate(dt)} ${wIcon(wc)}</span>
        <span style="font-size:1rem;font-weight:700;color:${rl.tc}">${r.toFixed(1)}<span style="font-size:.6rem;color:#7a9cc0"> มม.</span></span>
      </div>
      <div style="display:flex;align-items:center;gap:5px">
        <div style="flex:1;height:5px;background:#1a2e4a;border-radius:3px">
          <div style="width:${pct}%;height:100%;background:${rl.tc};border-radius:3px"></div>
        </div>
        <span style="font-size:.62rem;color:#7a9cc0">💧${p}%</span>
      </div></div>`;
  });
  const el=document.getElementById(prefix+'fc3d');if(el)el.innerHTML=html;
}

function render7d(prefix){
  const sel=document.getElementById(prefix+'sel7d');if(!sel)return;
  const s=STATIONS.find(x=>x.id===sel.value);if(!s||!s.forecast)return;
  const fc=s.forecast;let rows='';
  fc.dates.forEach((dt,i)=>{
    const r=fc.rain[i]||0,p=fc.prob[i]||0,wc=fc.wcode[i]||0,rl=rainLabel(r);
    rows+=`<tr><td>${fmtDate(dt)}</td><td>${wIcon(wc)}</td>
      <td style="color:${rl.tc};font-weight:600">${r.toFixed(1)}</td>
      <td style="color:#7a9cc0">${p}%</td>
      <td><span style="background:${rl.bg};color:${rl.tc};padding:1px 4px;border-radius:3px;font-size:.6rem">${rl.txt}</span></td></tr>`;
  });
  const el=document.getElementById(prefix+'fc7d');
  if(el)el.innerHTML=`<table class="day-table"><thead><tr><th>วัน</th><th></th><th>ฝน</th><th>โอกาส</th><th>ระดับ</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ── BOTTOM SHEET ──
let sheetOpen=false;
function toggleSheet(){sheetOpen?closeSheet():openSheet();}
function openSheet(){
  sheetOpen=true;
  document.getElementById('sheet').classList.add('open');
  document.getElementById('fab').textContent='✕';
}
function closeSheet(){
  sheetOpen=false;
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('fab').textContent='📊';
}
// Swipe down to close
let ty0=0;
const sheetEl=document.getElementById('sheet');
sheetEl.addEventListener('touchstart',e=>{ty0=e.touches[0].clientY;},{passive:true});
sheetEl.addEventListener('touchmove',e=>{if(e.touches[0].clientY-ty0>70)closeSheet();},{passive:true});

// ── INIT ──
// Build desktop sidebar
document.getElementById('sb').innerHTML=buildPanelHTML('d_');
renderProjects(document.getElementById('d_proj-list'));
render24h('d_');populateSel('d_');render3d('d_');render7d('d_');

// Build mobile sheet (different prefix = no ID clash)
document.getElementById('sheet-scroll').innerHTML=buildPanelHTML('m_');
renderProjects(document.getElementById('m_proj-list'));
render24h('m_');populateSel('m_');render3d('m_');render7d('m_');

// Map layers
renderThiessen();
renderStations();

// Radar
buildTimeline();
applyRadar();
animTimer=setInterval(()=>{curFrame=(curFrame+1)%RV_FRAMES.length;applyRadar();},700);

// Auto-refresh radar
setInterval(async()=>{
  try{
    const d=await fetch('https://api.rainviewer.com/public/weather-maps.json').then(r=>r.json());
    RV_FRAMES.length=0;
    d.radar.past.forEach(f=>RV_FRAMES.push({time:f.time,path:f.path}));
    curFrame=RV_FRAMES.length-1;
    buildTimeline();applyRadar();
  }catch(e){}
},5*60*1000);

window.addEventListener('resize',()=>{
  map.invalidateSize();
  if(!isMobile()&&sheetOpen)closeSheet();
});
</script>
</body>
