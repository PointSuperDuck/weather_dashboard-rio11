<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0d1b2a"/>
<title>สชป.11 Weather Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0a0e1a;--bg2:#0d1b2a;--bg3:#111e30;--bd:#1e3a5f;--bd2:#2a4a6e;--tx:#e0e6f0;--tx2:#a0b8d0;--tx3:#7a9cc0;--tx4:#4a7aaa;--bl:#1e90ff;--bl2:#0066cc}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top,0px)}
#hdr{background:linear-gradient(135deg,var(--bg2),#1a2744);border-bottom:1px solid var(--bd);padding:0 14px;height:50px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.hlogo{width:30px;height:30px;background:linear-gradient(135deg,var(--bl),#00c8ff);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.htx{margin-left:9px}.htx h1{font-size:.85rem;font-weight:700;color:#fff}.htx p{font-size:.58rem;color:var(--tx3)}
.hright{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hlive{display:flex;align-items:center;gap:4px;background:rgba(0,200,100,.12);border:1px solid rgba(0,200,100,.3);border-radius:20px;padding:3px 8px;font-size:.63rem;color:#00e676;font-weight:600}
.ldot{width:5px;height:5px;background:#00e676;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#clock{font-size:.72rem;color:var(--tx2);font-variant-numeric:tabular-nums}
#ctrl{height:40px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:5px;flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#ctrl::-webkit-scrollbar{display:none}
.lb{padding:4px 10px;border-radius:6px;border:1px solid var(--bd2);background:transparent;color:var(--tx2);font-size:.68rem;cursor:pointer;white-space:nowrap;-webkit-appearance:none;touch-action:manipulation;flex-shrink:0}
.lb.on{background:linear-gradient(135deg,var(--bl),var(--bl2));border-color:var(--bl);color:#fff}
.sep{width:1px;height:18px;background:var(--bd);flex-shrink:0;margin:0 2px}
.opc{display:flex;align-items:center;gap:5px;flex-shrink:0}
.opc label{font-size:.63rem;color:var(--tx3)}
.opc input[type=range]{width:65px;accent-color:var(--bl)}
.opv{font-size:.66rem;color:var(--tx3);width:24px}
/* SEARCH */
#searchbar{background:var(--bg2);border-bottom:1px solid var(--bd);padding:5px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;position:relative}
#search-input{flex:1;background:var(--bg3);border:1px solid var(--bd2);border-radius:6px;color:var(--tx);font-size:.75rem;padding:5px 10px;outline:none;font-family:inherit;-webkit-appearance:none}
#search-input:focus{border-color:var(--bl)}
#search-results{display:none;position:absolute;top:100%;left:0;right:0;z-index:3000;background:var(--bg2);border:1px solid var(--bd);border-top:none;max-height:260px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.6)}
.sr-item{padding:8px 14px;cursor:pointer;border-bottom:1px solid #1a2e4a;transition:background .15s}
.sr-item:hover,.sr-item:active{background:rgba(30,144,255,.1)}
.sr-name{font-size:.78rem;color:#d0e4f8;font-weight:600}
.sr-sub{font-size:.65rem;color:var(--tx3)}
/* ANIM BAR */
#animbar{height:36px;background:#060c18;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0}
.abtn{width:26px;height:26px;border-radius:5px;border:1px solid var(--bd2);background:transparent;color:var(--tx2);font-size:.78rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-appearance:none;touch-action:manipulation}
.abtn.on{background:var(--bl);border-color:var(--bl);color:#fff}
#tl{flex:1;display:flex;gap:2px;overflow:hidden;min-width:0}
.tf{flex:1;height:20px;border-radius:3px;background:#1a2e4a;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.48rem;color:var(--tx4);min-width:0;touch-action:manipulation}
.tf.on{background:var(--bl);color:#fff}
#atime{font-size:.63rem;color:var(--tx3);white-space:nowrap;flex-shrink:0}
/* BODY */
.body{display:flex;flex:1;overflow:hidden;min-height:0}
#map{flex:1;height:100%;z-index:1;min-width:0}
/* LOADING */
#loading{position:fixed;inset:0;z-index:9999;background:rgba(10,14,26,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.spinner{width:40px;height:40px;border:3px solid var(--bd2);border-top-color:var(--bl);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#load-msg{font-size:.8rem;color:var(--tx3)}
#load-sub{font-size:.68rem;color:var(--tx4)}
/* SIDEBAR */
#sb{width:295px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--bd);overflow-y:auto;-webkit-overflow-scrolling:touch}
#sb::-webkit-scrollbar{width:3px}
#sb::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
/* MOBILE SHEET */
#sheet{position:fixed;bottom:0;left:0;right:0;z-index:2000;background:var(--bg2);border-top:2px solid var(--bd);border-radius:16px 16px 0 0;max-height:78vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 24px rgba(0,0,0,.7);transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
#sheet.open{transform:translateY(0)}
#sheet-handle{width:36px;height:4px;background:var(--bd2);border-radius:2px;margin:10px auto 4px;flex-shrink:0;cursor:pointer}
#sheet-scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;z-index:1500;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--bl),var(--bl2));border:none;color:#fff;font-size:1.2rem;cursor:pointer;box-shadow:0 4px 16px rgba(30,144,255,.5);touch-action:manipulation;display:none;align-items:center;justify-content:center}
/* SECTIONS */
.ss{padding:11px;border-bottom:1px solid #1a2e4a}
.ss h3{font-size:.62rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx4);margin-bottom:8px}
/* FORECAST */
.ftabs{display:flex;gap:4px;margin-bottom:8px}
.ftab{flex:1;padding:5px 0;border-radius:6px;border:1px solid var(--bd2);background:transparent;color:var(--tx3);font-size:.68rem;cursor:pointer;text-align:center;-webkit-appearance:none;touch-action:manipulation}
.ftab.on{background:linear-gradient(135deg,#1e3a6e,#0d2a50);border-color:var(--bl);color:#fff}
.fpanel{display:none}.fpanel.on{display:block}
.fc-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.fc{background:var(--bg3);border:1px solid var(--bd);border-radius:6px;padding:7px}
.fc-name{font-size:.65rem;font-weight:600;color:#c0d8f0;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-rain{font-size:1rem;font-weight:700}
.fc-bar{height:3px;border-radius:2px;margin-top:4px;background:#1a2e4a}
.fc-fill{height:100%;border-radius:2px}
.sta-sel{width:100%;background:var(--bg3);border:1px solid var(--bd2);border-radius:6px;color:#c0d8f0;font-size:.72rem;padding:6px 8px;margin-bottom:7px;-webkit-appearance:none;cursor:pointer}
.day-table{width:100%;border-collapse:collapse;font-size:.66rem}
.day-table th{color:var(--tx4);font-weight:600;padding:4px;text-align:center;border-bottom:1px solid var(--bd)}
.day-table td{padding:4px;text-align:center;border-bottom:1px solid #111e30;color:#c0d8f0}
/* THIESSEN */
.th-box{background:var(--bg3);border:1px solid var(--bd);border-radius:7px;padding:9px;margin-bottom:5px}
.th-row{display:flex;justify-content:space-between;font-size:.67rem;color:var(--tx3);margin-bottom:3px}
.th-val{color:#c0d8f0;font-weight:600}
/* PROJECTS */
.pi{display:flex;align-items:flex-start;gap:7px;padding:7px 8px;border-radius:6px;border:1px solid var(--bd);background:var(--bg3);margin-bottom:4px;cursor:pointer;touch-action:manipulation}
.pi.sel,.pi:active{border-color:var(--bl);background:rgba(30,144,255,.08)}
.pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:3px}
.pname{font-size:.74rem;font-weight:600;color:#d0e4f8}
.rbadge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:.63rem;font-weight:700}
/* LEGEND */
.legbar{display:flex;height:10px;border-radius:3px;overflow:hidden;margin-bottom:3px}
.legbar div{flex:1}
.leglbl{display:flex;justify-content:space-between;font-size:.58rem;color:var(--tx4)}
/* ALERT */
.al{display:flex;gap:7px;padding:8px;background:rgba(255,100,50,.07);border:1px solid rgba(255,100,50,.22);border-radius:6px;margin-bottom:5px}
.at{font-size:.67rem;color:#e0a080;line-height:1.5}
.at strong{color:#ff8060;display:block;margin-bottom:1px}
.noal{font-size:.68rem;color:#3a6a4a;background:rgba(0,200,100,.06);border:1px solid rgba(0,200,100,.18);border-radius:6px;padding:8px;text-align:center}
/* DATA SOURCE BADGE */
.src-badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:.58rem;background:rgba(30,144,255,.15);color:#7ac8f0;border:1px solid rgba(30,144,255,.25);margin-left:4px}
.updt{font-size:.62rem;color:var(--tx4);text-align:center;padding:8px}
.disclaimer{font-size:.6rem;color:#4a6a8a;padding:8px 11px;line-height:1.5;border-top:1px solid #1a2e4a}
@media(max-width:768px){#sb{display:none}#fab{display:flex}.htx p{display:none}}
@media(min-width:769px){#sheet{display:none !important}#fab{display:none !important}}

/* ── ALERT SYSTEM ── */
#alert-modal{
  display:none;position:fixed;inset:0;z-index:9998;
  background:rgba(0,0,0,.75);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;padding:16px;
}
#alert-modal.show{display:flex;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.alert-modal-box{
  background:#0d1b2a;border-radius:14px;padding:24px;
  max-width:420px;width:100%;
  box-shadow:0 8px 40px rgba(0,0,0,.8);
  position:relative;
}
.alert-modal-box.critical{border:2px solid #ef5350;box-shadow:0 0 30px rgba(239,83,80,.4)}
.alert-modal-box.warning{border:2px solid #ffee58;box-shadow:0 0 30px rgba(255,238,88,.3)}
.alert-modal-box.info{border:2px solid #4fc3f7;box-shadow:0 0 20px rgba(79,195,247,.2)}
.am-icon{font-size:2.5rem;text-align:center;margin-bottom:10px}
.am-title{font-size:1.1rem;font-weight:700;color:#fff;text-align:center;margin-bottom:6px}
.am-subtitle{font-size:.78rem;color:#a0b8d0;text-align:center;margin-bottom:14px}
.am-stations{background:#111e30;border-radius:8px;padding:10px;margin-bottom:14px}
.am-sta-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1e3a5f;font-size:.75rem}
.am-sta-row:last-child{border-bottom:none}
.am-sta-name{color:#c0d8f0}
.am-sta-val{font-weight:700;padding:2px 8px;border-radius:4px}
.am-actions{display:flex;gap:8px}
.am-btn{flex:1;padding:9px;border-radius:8px;border:none;font-size:.8rem;font-weight:600;cursor:pointer;touch-action:manipulation}
.am-btn-close{background:#1e3a5f;color:#a0b8d0}
.am-btn-mute{background:#2a4a6e;color:#7ac8f0}
.am-btn-mute.muted{background:#1a2e4a;color:#4a7aaa}
.am-time{font-size:.62rem;color:#4a7aaa;text-align:center;margin-top:8px}

/* ALERT INDICATOR BAR */
#alert-bar{
  display:none;height:32px;
  align-items:center;justify-content:space-between;
  padding:0 14px;flex-shrink:0;cursor:pointer;
  font-size:.72rem;font-weight:600;
  animation:alertPulse 2s infinite;
}
#alert-bar.critical{background:linear-gradient(135deg,#b71c1c,#c62828);color:#fff;display:flex}
#alert-bar.warning{background:linear-gradient(135deg,#f57f17,#f9a825);color:#1a1a00;display:flex}
@keyframes alertPulse{0%,100%{opacity:1}50%{opacity:.85}}

/* ALERT BADGE on live indicator */
#alert-count{
  display:none;background:#ef5350;color:#fff;
  border-radius:50%;width:16px;height:16px;
  font-size:.55rem;font-weight:700;
  align-items:center;justify-content:center;
  margin-left:4px;
}
#alert-count.show{display:flex}

</style>
</head>
<body>
<div id="loading" style="position:fixed;inset:0;z-index:9999;background:#0a0e1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px">
  <div style="width:40px;height:40px;border:3px solid #1e3a5f;border-top-color:#1e90ff;border-radius:50%;animation:spin .8s linear infinite"></div>
  <div style="font-size:.8rem;color:#7a9cc0">สชป.11 Weather Dashboard</div>
  <div style="font-size:.68rem;color:#4a7aaa">กำลังเตรียมข้อมูล...</div>
</div>
<div id="app">
  <div id="hdr">
    <div style="display:flex;align-items:center;flex:1;min-width:0">
      <div class="hlogo">🛰️</div>
      <div class="htx">
        <h1>สชป.11 Weather Dashboard</h1>
        <p>เรดาร์ฝน · คลอง · อาคาร · Thiessen · พยากรณ์ 7 วัน · ข้อมูลจริง</p>
      </div>
    </div>
    <div class="hright">
      <div class="hlive" onclick="showAlertModal()" style="cursor:pointer"><div class="ldot"></div>LIVE<span id="alert-count"></span></div>
      <div id="clock">--:--:--</div>
    </div>
  </div>
  <!-- ALERT BAR -->
  <div id="alert-bar" onclick="showAlertModal()">
    <span id="alert-bar-text">⚠️ มีการแจ้งเตือน</span>
    <span style="font-size:.65rem;opacity:.8">คลิกเพื่อดูรายละเอียด ▶</span>
  </div>
  <div id="ctrl">
    <span style="font-size:.6rem;color:var(--tx4);flex-shrink:0">Map</span>
    <button class="lb on" id="btn-osm"  onclick="setBase('osm')">🗺️ OSM</button>
    <button class="lb"    id="btn-esri" onclick="setBase('esri')">🛰️ Satellite</button>
    <button class="lb"    id="btn-dark" onclick="setBase('dark')">🌑 Dark</button>
    <div class="sep"></div>
    <button class="lb on" id="btn-proj"   onclick="toggleLayer('proj')"   title="ขอบเขตโครงการ">📐</button>
    <button class="lb on" id="btn-thies"  onclick="toggleLayer('thies')"  title="Thiessen">🔷</button>
    <button class="lb on" id="btn-canal"  onclick="toggleLayer('canal')"  title="คลองชลประทาน">〰️</button>
    <button class="lb on" id="btn-struct" onclick="toggleLayer('struct')" title="อาคารชลประทาน">🏗️</button>
    <button class="lb on" id="btn-sta"    onclick="toggleLayer('sta')"    title="สถานีวัดฝน">📍</button>
    <div class="sep"></div>
    <div class="opc">
      <label>เรดาร์</label>
      <input type="range" id="opSlider" min="0" max="100" value="75" oninput="updateOpacity(this.value)"/>
      <span class="opv" id="opVal">75%</span>
    </div>
  </div>
  <!-- SEARCH -->
  <div id="searchbar">
    <span style="font-size:.75rem;flex-shrink:0;color:var(--tx3)">🔍</span>
    <input id="search-input" type="text" placeholder="ค้นหาชื่ออาคาร หรือชื่อคลอง..."
      oninput="onSearch(this.value)" onfocus="showResults()"/>
    <button onclick="clearSearch()" style="background:transparent;border:none;color:var(--tx3);font-size:.9rem;cursor:pointer;flex-shrink:0;padding:2px 4px">✕</button>
    <div id="search-results"></div>
  </div>
  <div id="animbar">
    <button class="abtn" onclick="stepFrame(-1)">◀</button>
    <button class="abtn on" id="btn-play" onclick="togglePlay()">⏸</button>
    <button class="abtn" onclick="stepFrame(1)">▶</button>
    <div id="tl"></div>
    <div id="atime">--:--</div>
  </div>
  <div class="body">
    <div id="map"></div>
    <div id="sb"></div>
  </div>
</div>
<div id="sheet">
  <div id="sheet-handle" onclick="toggleSheet()"></div>
  <div id="sheet-scroll"></div>
</div>
<button id="fab" onclick="toggleSheet()">📊</button>

// ── VORONOI THIESSEN ──
function cross(O,A,B){return(A[0]-O[0])*(B[1]-O[1])-(A[1]-O[1])*(B[0]-O[0]);}
function convexHull(pts){
  if(pts.length<3)return pts;
  const p=[...pts].sort((a,b)=>a[0]-b[0]||a[1]-b[1]),n=p.length,h=[];
  for(let i=0;i<n;i++){while(h.length>=2&&cross(h[h.length-2],h[h.length-1],p[i])<=0)h.pop();h.push(p[i]);}
  const lo=h.length+1;
  for(let i=n-2;i>=0;i--){while(h.length>=lo&&cross(h[h.length-2],h[h.length-1],p[i])<=0)h.pop();h.push(p[i]);}
  h.pop();return h;
}
function computeVoronoi(){
  const G=250,dLon=(BBOX.maxLon-BBOX.minLon)/G,dLat=(BBOX.maxLat-BBOX.minLat)/G;
  const cells={};STATIONS.forEach(s=>cells[s.id]=[]);
  for(let i=0;i<G;i++)for(let j=0;j<G;j++){
    const lon=BBOX.minLon+(i+.5)*dLon,lat=BBOX.minLat+(j+.5)*dLat;
    let best=null,bd=Infinity;
    for(const s of STATIONS){const d=dist2(lat,lon,s.lat,s.lon);if(d<bd){bd=d;best=s;}}
    if(best)cells[best.id].push([lon,lat]);
  }
  const res={};
  STATIONS.forEach(s=>{
    const pts=cells[s.id];if(!pts.length)return;
    const hl=dLon/2,hlt=dLat/2,corners=[];
    pts.forEach(([lo,la])=>{corners.push([lo-hl,la-hlt],[lo+hl,la-hlt],[lo+hl,la+hlt],[lo-hl,la+hlt]);});
    res[s.id]={station:s,polygon:convexHull(corners)};
  });
  return res;
}

// ✅ Thiessen weighted average per project
function calcProjectThiessen(feat){
  const coords=feat.geometry.coordinates[0];
  const lons=coords.map(c=>c[0]),lats=coords.map(c=>c[1]);
  const minLon=Math.min(...lons),maxLon=Math.max(...lons);
  const minLat=Math.min(...lats),maxLat=Math.max(...lats);
  const G=20,dLon=(maxLon-minLon)/G,dLat=(maxLat-minLat)/G;
  const staCounts={};STATIONS.forEach(s=>staCounts[s.id]=0);
  let total=0;
  for(let i=0;i<G;i++)for(let j=0;j<G;j++){
    const lon=minLon+(i+.5)*dLon,lat=minLat+(j+.5)*dLat;
    let best=null,bd=Infinity;
    for(const s of STATIONS){const d=dist2(lat,lon,s.lat,s.lon);if(d<bd){bd=d;best=s;}}
    if(best){staCounts[best.id]++;total++;}
  }
  if(total===0)return{rain:0,r3:0,r7:0,staName:'--'};
  let wRain=0,w3d=0,w7d=0,maxW=0,maxSta='--';
  STATIONS.forEach(s=>{
    const w=staCounts[s.id]/total;
    if(w>0){
      wRain+=w*(s.rain||0);
      const fc=s.forecast;
      if(fc){w3d+=w*(fc.rain.slice(0,3).reduce((a,b)=>a+b,0));w7d+=w*(fc.rain.reduce((a,b)=>a+b,0));}
      if(w>maxW){maxW=w;maxSta=s.name;}
    }
  });
  return{rain:Math.round(wRain*10)/10,r3:Math.round(w3d*10)/10,r7:Math.round(w7d*10)/10,staName:maxSta};
}

function renderThiessen(){
  thiesGroup.clearLayers();
  const v=computeVoronoi();
  let t0=0,t3=0,t7=0,maxR=0,maxSta='',cnt=0;
  Object.values(v).forEach(({station:s,polygon:poly})=>{
    if(!poly||poly.length<3)return;
    const rain=s.rain||0,fc=s.forecast;
    const r3=fc?fc.rain.slice(0,3).reduce((a,b)=>a+b,0):0;
    const r7=fc?fc.rain.reduce((a,b)=>a+b,0):0;
    const rl=rainLabel(rain);
    t0+=rain;t3+=r3;t7+=r7;cnt++;
    if(rain>maxR){maxR=rain;maxSta=s.name;}
    L.polygon(poly.map(([lo,la])=>[la,lo]),{
      color:'#fff',weight:2,fillColor:rainColor(rain),fillOpacity:0.5,opacity:0.85
    }).bindPopup(popupHTML(`📍 ${s.name}`,rain,r3,r7,rl,'🔷 Thiessen Zone · ฝนสะสม 24ชม.')).addTo(thiesGroup);
  });
  if(cnt){
    document.querySelectorAll('.avg0-val').forEach(el=>el.textContent=(t0/cnt).toFixed(1)+' มม.');
    document.querySelectorAll('.avg3-val').forEach(el=>el.textContent=(t3/cnt).toFixed(1)+' มม.');
    document.querySelectorAll('.avg7-val').forEach(el=>el.textContent=(t7/cnt).toFixed(1)+' มม.');
    document.querySelectorAll('.maxsta-val').forEach(el=>el.textContent=maxSta+' ('+maxR+' มม.)');
  }
}

let searchIndex=[];
function buildSearchIndex(){
  searchIndex=[];
  STRUCTS_DATA.forEach((s,i)=>{
    if(s.name)searchIndex.push({type:'struct',label:'🏗️ '+s.name,sub:s.proj||'',lat:s.lat,lon:s.lon,idx:i});
  });
  CANALS_GEO.features.forEach((f,i)=>{
    const n=f.properties.n||'';
    if(n){
      const c=f.geometry.coordinates,mid=c[Math.floor(c.length/2)];
      searchIndex.push({type:'canal',label:'🌊 '+n,sub:f.properties.proj||'',lat:mid[1],lon:mid[0],idx:i});
    }
  });
}
function onSearch(val){
  const q=val.trim().toLowerCase();
  const el=document.getElementById('search-results');
  if(!q){el.style.display='none';return;}
  const matches=searchIndex.filter(m=>m.label.toLowerCase().includes(q)||m.sub.toLowerCase().includes(q)).slice(0,20);
  if(!matches.length){el.innerHTML='<div style="padding:10px 14px;font-size:.75rem;color:var(--tx3)">ไม่พบผลลัพธ์</div>';el.style.display='block';return;}
  el.innerHTML=matches.map((m,i)=>`<div class="sr-item" onclick="selectResult(${searchIndex.indexOf(m)})"><div class="sr-name">${m.label}</div>${m.sub?`<div class="sr-sub">${m.sub}</div>`:''}</div>`).join('');
  el.style.display='block';
}
function showResults(){const q=document.getElementById('search-input').value.trim();if(q)onSearch(q);}
function selectResult(idx){
  const item=searchIndex[idx];if(!item)return;
  map.flyTo([item.lat,item.lon],14,{duration:1.2});
  if(item.type==='struct'){
    const s=STRUCTS_DATA[item.idx];const rl=rainLabel(s.rain);
    L.popup().setLatLng([item.lat,item.lon])
      .setContent(`<div style="font-family:sans-serif;min-width:170px"><b>🏗️ ${s.name}</b><br><span style="font-size:.72rem;color:#aaa">${s.proj} | จ.${s.prov}</span><hr style="border-color:#333;margin:5px 0"><div style="background:${rl.bg};border:1px solid ${rl.tc}44;border-radius:5px;padding:6px;text-align:center"><div style="font-size:1.1rem;font-weight:700;color:${rl.tc}">🌧️ ${s.rain!=null?s.rain.toFixed(1):'--'} มม.</div><div style="font-size:.68rem;color:${rl.tc}">${rl.txt} · ฝนสะสม 24ชม.</div></div></div>`)
      .openOn(map);
  }else{
    const f=CANALS_GEO.features[item.idx];const p=f.properties;
    L.popup().setLatLng([item.lat,item.lon])
      .setContent(`<b>🌊 ${p.n||'คลองชลประทาน'}</b><br>โครงการ: ${p.proj||'-'}<br>ประเภท: ${p.type||'-'}<br>ความยาว: ${p.len||'-'} กม.`)
      .openOn(map);
  }
  document.getElementById('search-results').style.display='none';
  document.getElementById('search-input').value=item.label.replace(/^[🏗️🌊]\s*/,'');
  if(isMobile())closeSheet();
}

// ── AUTO REFRESH (✅ ใช้ daily_sum[0] ทุกครั้ง) ──
async function refreshAll(){
  try{
    // Refresh radar (non-blocking)
    const rv=await fetch('https://api.rainviewer.com/public/weather-maps.json',{signal:AbortSignal.timeout(8000)}).then(r=>r.json());
    RV_FRAMES.length=0;rv.radar.past.forEach(f=>RV_FRAMES.push({time:f.time,path:f.path}));
    curFrame=RV_FRAMES.length-1;buildTimeline();applyRadar();

    // Refresh station rain (daily_sum[0])
    await Promise.all(STATIONS.map(async s=>{
      try{
        const url=`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&daily=precipitation_sum,precipitation_probability_max,weathercode&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&forecast_days=7&timezone=Asia%2FBangkok`;
        const d=await fetch(url).then(r=>r.json());
        s.rain=Math.round((d.daily.precipitation_sum[0]||0)*10)/10;
        s.temp=d.current.temperature_2m;
        s.hum=d.current.relative_humidity_2m;
        s.wind=d.current.wind_speed_10m;
        s.forecast={dates:d.daily.time,rain:d.daily.precipitation_sum,prob:d.daily.precipitation_probability_max,wcode:d.daily.weathercode};
      }catch(e){}
    }));

    // Refresh structure rain (batch daily_sum[0])
    const BATCH=50;
    for(let i=0;i<STRUCTS_DATA.length;i+=BATCH){
      const batch=STRUCTS_DATA.slice(i,i+BATCH);
      const lats=batch.map(s=>s.lat).join(','),lons=batch.map(s=>s.lon).join(',');
      try{
        const url=`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&daily=precipitation_sum&forecast_days=1&timezone=Asia%2FBangkok`;
        const d=await fetch(url).then(r=>r.json());
        if(Array.isArray(d))d.forEach((item,j)=>{STRUCTS_DATA[i+j].rain=Math.round(((item.daily?.precipitation_sum||[0])[0]||0)*10)/10;});
        else STRUCTS_DATA[i].rain=Math.round(((d.daily?.precipitation_sum||[0])[0]||0)*10)/10;
      }catch(e){}
      await new Promise(r=>setTimeout(r,200));
    }

    renderThiessen();renderProjects();renderStructures();renderStations();
    ['d_','m_'].forEach(pfx=>{render24h(pfx);render3d(pfx);render7d(pfx);});
    updateAlerts();updateTimestamp();
  }catch(e){console.error('Refresh error:',e);}
}
setInterval(refreshAll,10*60*1000);

// ── ALERT SYSTEM ──
let alertMuted = false;
let lastAlertLevel = 0;  // 0=none, 1=info, 2=warning, 3=critical
let alertAudioCtx = null;

// Thresholds (mm/24h)
const THRESH = {
  INFO:     10,   // ฝนเล็กน้อย
  WARNING:  35,   // ฝนหนัก
  CRITICAL: 90    // ฝนหนักมาก
};

function getAlertLevel(rain){
  if(rain >= THRESH.CRITICAL) return 3;
  if(rain >= THRESH.WARNING)  return 2;
  if(rain >= THRESH.INFO)     return 1;
  return 0;
}

function getLevelConfig(level){
  const cfg = {
    3: {cls:'critical', icon:'🚨', title:'เฝ้าระวังฝนหนักมาก!', color:'#ef5350', barCls:'critical'},
    2: {cls:'warning',  icon:'⛈️', title:'เฝ้าระวังฝนหนัก',     color:'#ffee58', barCls:'warning'},
    1: {cls:'info',     icon:'🌧️', title:'มีฝนในพื้นที่',        color:'#4fc3f7', barCls:''},
    0: {cls:'',         icon:'✅', title:'ปกติ',                  color:'#00e676', barCls:''}
  };
  return cfg[level] || cfg[0];
}

// ── SOUND ALERT (Web Audio API - ไม่ต้องโหลดไฟล์) ──
function playAlertSound(level){
  if(alertMuted || level === 0) return;
  try{
    if(!alertAudioCtx) alertAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = alertAudioCtx;
    
    const patterns = {
      3: [{f:880,d:.15},{f:0,d:.05},{f:880,d:.15},{f:0,d:.05},{f:1100,d:.3}],  // critical: 3 beeps
      2: [{f:660,d:.2},{f:0,d:.1},{f:880,d:.3}],                                // warning: 2 beeps
      1: [{f:440,d:.3}]                                                           // info: 1 soft beep
    };
    
    let t = ctx.currentTime + 0.1;
    (patterns[level] || patterns[1]).forEach(({f,d})=>{
      if(f > 0){
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = f;
        osc.type = level === 3 ? 'square' : 'sine';
        gain.gain.setValueAtTime(level === 3 ? 0.3 : 0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + d);
        osc.start(t);
        osc.stop(t + d);
      }
      t += d;
    });
  }catch(e){ console.warn('Audio error:', e); }
}

function toggleMute(){
  alertMuted = !alertMuted;
  const btn = document.getElementById('am-mute-btn');
  btn.textContent = alertMuted ? '🔕 เสียงปิด' : '🔔 เสียงเปิด';
  btn.classList.toggle('muted', alertMuted);
}

// ── MAIN ALERT CHECK ──
function checkAndAlert(){
  const maxR = Math.max(...STATIONS.map(s => s.rain || 0));
  const structMaxR = Math.max(...STRUCTS_DATA.map(s => s.rain || 0));
  const overallMax = Math.max(maxR, structMaxR);
  const level = getAlertLevel(overallMax);
  const cfg = getLevelConfig(level);
  
  // Update alert bar
  const bar = document.getElementById('alert-bar');
  const barText = document.getElementById('alert-bar-text');
  bar.className = '';
  
  if(level >= 2){
    bar.classList.add(cfg.barCls);
    const heavyStations = STATIONS.filter(s => (s.rain||0) >= THRESH.WARNING)
      .map(s => s.name).join(', ');
    barText.textContent = `${cfg.icon} ${cfg.title} · สูงสุด ${overallMax.toFixed(1)} มม. · ${heavyStations||'บางพื้นที่'}`;
  } else if(level === 1){
    bar.style.display = 'none';
  } else {
    bar.style.display = 'none';
  }
  
  // Update sidebar alerts
  updateSidebarAlerts(level, overallMax, maxR, structMaxR);
  
  // Show modal + sound only when level increases
  if(level > lastAlertLevel && level >= 2){
    showAlertModal();
    playAlertSound(level);
  }
  lastAlertLevel = level;
  
  // Update alert count badge
  const badge = document.getElementById('alert-count');
  if(level >= 2){
    badge.textContent = level === 3 ? '!' : '1';
    badge.classList.add('show');
  } else {
    badge.classList.remove('show');
  }
}

function updateSidebarAlerts(level, overallMax, stationMax, structMax){
  const cfg = getLevelConfig(level);
  let html = '';
  
  if(level === 0){
    html = '<div class="noal">✅ ไม่มีการแจ้งเตือนพิเศษ</div>';
  } else {
    const heavySta = STATIONS.filter(s=>(s.rain||0)>=THRESH.WARNING);
    const heavyStruct = STRUCTS_DATA.filter(s=>(s.rain||0)>=THRESH.WARNING).length;
    
    html = `<div class="al" style="background:${level>=3?'rgba(239,83,80,.1)':'rgba(255,238,88,.07)'};border-color:${level>=3?'rgba(239,83,80,.4)':'rgba(255,238,88,.3)'}">
      <span style="font-size:1.1rem">${cfg.icon}</span>
      <div class="at">
        <strong style="color:${cfg.color}">${cfg.title}</strong>
        ฝนสะสม 24ชม. สูงสุด <b style="color:${cfg.color}">${overallMax.toFixed(1)} มม.</b><br>
        ${heavySta.length>0?`สถานี: ${heavySta.map(s=>s.name).join(', ')}<br>`:''}
        ${heavyStruct>0?`อาคารชลประทาน: ${heavyStruct} แห่ง`:''}
      </div>
    </div>`;
    
    if(level >= 3){
      html += `<div style="background:rgba(239,83,80,.08);border:1px solid rgba(239,83,80,.25);border-radius:6px;padding:8px;font-size:.68rem;color:#ef9a9a;line-height:1.6">
        ⚠️ <b>คำแนะนำ:</b> ติดตามสถานการณ์อย่างใกล้ชิด ตรวจสอบระดับน้ำในคลองและอาคารชลประทาน พิจารณาการระบายน้ำตามแผนปฏิบัติการ
      </div>`;
    }
  }
  
  document.querySelectorAll('.alert-box').forEach(el => el.innerHTML = html);
}

function showAlertModal(){
  const maxR = Math.max(...STATIONS.map(s => s.rain || 0));
  const structMaxR = Math.max(...STRUCTS_DATA.map(s => s.rain || 0));
  const overallMax = Math.max(maxR, structMaxR);
  const level = getAlertLevel(overallMax);
  const cfg = getLevelConfig(level);
  
  if(level === 0) return;
  
  // Build station list
  const alertStations = STATIONS
    .filter(s => (s.rain||0) >= THRESH.INFO)
    .sort((a,b) => (b.rain||0)-(a.rain||0));
  
  let stationsHTML = '';
  alertStations.forEach(s => {
    const rl = rainLabel(s.rain);
    stationsHTML += `<div class="am-sta-row">
      <span class="am-sta-name">📍 ${s.name}</span>
      <span class="am-sta-val" style="background:${rl.bg};color:${rl.tc}">${(s.rain||0).toFixed(1)} มม.</span>
    </div>`;
  });
  
  if(!stationsHTML) stationsHTML = '<div style="font-size:.75rem;color:#7a9cc0;text-align:center;padding:8px">ไม่มีสถานีที่เกินเกณฑ์</div>';
  
  // Update modal
  document.getElementById('am-icon').textContent = cfg.icon;
  document.getElementById('am-title').textContent = cfg.title;
  document.getElementById('am-subtitle').textContent = 
    `ฝนสะสม 24ชม. สูงสุด ${overallMax.toFixed(1)} มม. · ${new Date(Date.now()+7*3600000).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})} UTC+7`;
  document.getElementById('am-stations').innerHTML = stationsHTML;
  document.getElementById('am-time').textContent = 
    `ข้อมูล: Open-Meteo ERA5 · เกณฑ์: ฝนหนัก ≥35มม. | ฝนหนักมาก ≥90มม.`;
  
  const box = document.getElementById('alert-modal-box');
  box.className = 'alert-modal-box ' + cfg.cls;
  
  document.getElementById('alert-modal').classList.add('show');
}

function closeAlertModal(){
  document.getElementById('alert-modal').classList.remove('show');
}

// Close modal on backdrop click
document.getElementById('alert-modal').addEventListener('click', e => {
  if(e.target === document.getElementById('alert-modal')) closeAlertModal();
});

// Override updateAlerts to use new system
function updateAlerts(){ checkAndAlert(); }

</script>
